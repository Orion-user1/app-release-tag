
pipeline:
  name: App Release Tag
  identifier: cicd_app_release_tag
  projectIdentifier: <+project.identifier>
  orgIdentifier: <+org.identifier>
  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build: <+input>

  stages:
    - stage:
        name: App Release Tag
        identifier: app_release_tag
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Create Release Tag
                  identifier: create_release_tag
                  spec:
                    connectorRef: <+input>
                    image: alpine/git:latest
                    shell: Bash
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("github_token")>
                    command: |
                      #!/bin/bash
                      set -e

                      echo "========================================="
                      echo "Creating Release Tag from RC Version"
                      echo "========================================="

                      # Configure git
                      git config --global user.name "Harness CI"
                      git config --global user.email "ci@harness.io"

                      # Configure git credential helper for authentication
                      if [ ! -z "$GITHUB_TOKEN" ]; then
                        git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
                        echo "Git authentication configured using token"
                      else
                        echo "Warning: GITHUB_TOKEN not found. Assuming git credentials are already configured."
                      fi

                      # Fetch all tags
                      git fetch --tags

                      # Get the latest RC tag (e.g., v1.1.20-rc1, v1.1.20-rc2)
                      LATEST_RC_TAG=$(git tag -l "v*-rc*" | sort -V | tail -n 1)

                      if [ -z "$LATEST_RC_TAG" ]; then
                        echo "Error: No RC tag found. Please ensure an RC tag exists before creating a release tag."
                        exit 1
                      fi

                      echo "Latest RC Tag found: $LATEST_RC_TAG"

                      # Extract version without RC suffix (e.g., v1.1.20-rc1 -> v1.1.20)
                      RELEASE_TAG=$(echo $LATEST_RC_TAG | sed 's/-rc[0-9]*$//')

                      echo "Creating Release Tag: $RELEASE_TAG"

                      # Check if release tag already exists
                      if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
                        echo "Warning: Release tag $RELEASE_TAG already exists."
                        echo "Deleting existing tag..."
                        git tag -d "$RELEASE_TAG" || true
                        git push origin --delete "$RELEASE_TAG" || true
                      fi

                      # Get the commit SHA of the latest RC tag
                      RC_COMMIT=$(git rev-list -n 1 "$LATEST_RC_TAG")
                      echo "RC Tag commit SHA: $RC_COMMIT"

                      # Create the release tag on the same commit as RC tag
                      git tag -a "$RELEASE_TAG" $RC_COMMIT -m "Release tag $RELEASE_TAG created from $LATEST_RC_TAG"

                      # Push the release tag to origin
                      echo "Pushing release tag to remote repository..."
                      git push origin "$RELEASE_TAG"

                      echo "========================================="
                      echo "Release tag $RELEASE_TAG created successfully!"
                      echo "========================================="

                      # Clean up old RC tags (optional)
                      echo ""
                      echo "Cleaning up old RC tags..."

                      # Get all RC tags for this version
                      VERSION_PREFIX=$(echo $RELEASE_TAG | sed 's/v//')
                      OLD_RC_TAGS=$(git tag -l "v${VERSION_PREFIX}-rc*")

                      if [ ! -z "$OLD_RC_TAGS" ]; then
                        echo "Found RC tags to clean up:"
                        echo "$OLD_RC_TAGS"

                        # Delete RC tags locally and remotely
                        for tag in $OLD_RC_TAGS; do
                          echo "Deleting RC tag: $tag"
                          git tag -d "$tag" || true
                          git push origin --delete "$tag" || true
                        done

                        echo "RC tags cleaned up successfully!"
                      else
                        echo "No RC tags found to clean up."
                      fi

                      echo ""
                      echo "========================================="
                      echo "Process completed successfully!"
                      echo "Release Tag: $RELEASE_TAG"
                      echo "========================================="
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
